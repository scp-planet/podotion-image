name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Cross-build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            suffix=""
            [ "$goos" = "windows" ] && suffix=".exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -o "dist/podotion-image-$goos-$goarch$suffix" ./cmd/podotion-image
          done
